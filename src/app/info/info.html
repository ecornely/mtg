<div class="form-control w-full max-w-4xl mx-auto p-4">
<textarea
    [formControl]="searchControl"
    class="textarea textarea-bordered textarea-primary w-full h-64 resize-none text-base focus:placeholder-transparent"
    placeholder="Search multiple cards at once, separate them with a new line (english names only)"
    [class.textarea-error]="searchControl.invalid && searchControl.touched"
  ></textarea>
</div>

<div class="form-control w-full max-w-4xl mx-auto p-4 flex flex-row justify-center">
    <button class="btn btn-primary" [disabled]="searchControl.invalid" (click)="searchCards($event)">Search</button>
</div>

<div class="form-control w-full">
    @if (searchResult && searchResult.length > 0) {
        <div class="form-control w-full max-w-4xl mx-auto p-4 flex flex-row justify-center">
            <button class="btn btn-primary" (click)="copyContext($event)">{{contextCopiedText() != null ? 'Context Copied!' : 'Copy Context JSON'}}</button>
        </div>
        <div class="grid grid-cols-3 sm:grid-cols-2 lg:grid-cols-5 gap-1">
        @for (card of searchResult; track card.id) {
            <div class="card bg-base-200 p-4 border border-base-300 shadow-sm">
                <h4 class="text-center">{{ card.name }} <button href="#" [cdkCopyToClipboard]="card.name" (cdkCopyToClipboardCopied)="onCopied(card.name)">📋</button></h4>
                <div class="text-center border border-base-300">{{ copiedText() === card.name ? 'Copied!' : '' }}</div>
                <a href="{{ card.scryfall_uri }}" target="_blank" class="text-sm text-primary">
                    <img [src]="card.image_uris?.png" alt="{{ card.name }}" class="mb-4">
                </a>
            </div>
        }
        </div>
    }
</div>
