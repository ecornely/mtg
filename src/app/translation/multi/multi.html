<div class="form-control w-full max-w-4xl mx-auto p-4">
<textarea
    [formControl]="searchControl"
    class="textarea textarea-bordered textarea-primary w-full h-64 resize-none text-base focus:placeholder-transparent"
    [placeholder]="'Translate multiple cards here...'"
    [class.textarea-error]="searchControl.invalid && searchControl.touched"
  ></textarea>
</div>

<div class="form-control w-full max-w-4xl mx-auto p-4 flex flex-row justify-between items-center">
    <button class="btn btn-primary" [disabled]="searchControl.invalid" (click)="translate($event)">To french</button>
    <button class="btn btn-primary" [disabled]="searchControl.invalid" (click)="translate($event, 'en')">To english</button>
</div>

<div class="form-control w-full max-w-lg mx-auto p-4"><!-- TODO add (click)="copyToClipboard() avec toaster qui dit copied !"-->
    @if (translatedText) {
        <p
            class="textarea textarea-bordered textarea-primary w-full min-h-64 resize-none text-base" style="white-space: pre;">{{ translatedText }}</p>
    }
</div>
